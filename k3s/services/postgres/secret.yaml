# Credencial de DESENVOLVIMENTO LOCAL apenas — nunca usada fora do k3d.
# Em QA/stage/prod a credencial vem do SecretStore (ADR-0001), nunca de manifesto.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_USER: dop
  POSTGRES_PASSWORD: dop-local-dev
  POSTGRES_DB: dop
