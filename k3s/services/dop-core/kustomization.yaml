apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - networkpolicy.yaml
  # rbac-launcher.yaml stays OUT: it is a ClusterRole (a namespace per demand
  # does not fit in a Role), and while RegisterLauncher is a skeleton it would
  # widen the blast radius for nothing in return. Enable it along with the
  # launcher.
  # - rbac-launcher.yaml
  - pvc-repos.yaml
  - secret.yaml
  - configmap.yaml
  - deployment-serve.yaml
  - deployment-worker.yaml
  - deployment-sched.yaml
  - service.yaml
# The fourth mode — launcher — stays out for now: it is a daemon of the
# EXECUTION cluster (it provisions sandboxes), which does not exist locally yet.
# It comes in when there is an execution cluster for it to govern.
