apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - networkpolicy.yaml
  # rbac-launcher.yaml fica FORA: é ClusterRole (namespace por demanda não cabe
  # em Role), e enquanto RegisterLauncher for esqueleto isso seria ampliar o
  # raio de explosão sem nada em troca. Habilite junto com o launcher.
  # - rbac-launcher.yaml
  - secret.yaml
  - configmap.yaml
  - deployment-serve.yaml
  - deployment-worker.yaml
  - deployment-sched.yaml
  - service.yaml
# O quarto modo — launcher — fica de fora por ora: é daemon do cluster de
# EXECUÇÃO (provisiona sandboxes), que no local ainda não existe. Entra quando
# houver cluster de execução para ele governar.
