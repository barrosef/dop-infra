# The worker mode — it consumes events from NATS, builds projections and runs
# the outbox relay (ADR-0014): it is the one that carries the event written in
# the transaction all the way to the broker.
# The SAME image as serve; only the argument changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-core-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: dop-core, mode: worker }
  template:
    metadata:
      labels: { app: dop-core, mode: worker }
    spec:
      serviceAccountName: dop-core
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-core
          image: dop-registry:5000/dop/dop-core:0.1.0-21
          args: ["worker"]
          ports:
            - { name: health, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: dop-core-env }
            - secretRef:    { name: dop-core }
          env:
            # Only `serve` HOSTS the projects' root repositories — it is the one
            # with the volume. This mode talks to it over the platform-side API;
            # with the default (`local`) it would host a second, empty set on a
            # disk nobody backs up, and the manifests would be regenerated into
            # the void.
            - { name: PROJECT_REPO_BACKEND,    value: "remote" }
            - { name: PROJECT_REPO_SERVER_URL, value: "http://dop-core.dop-local.svc:9091" }
            # The worker migrates and seeds at boot (ADR-0024); the profile
            # adds the development seeds on top of the root ones.
            - { name: DOP_SEED_PROFILE,        value: "local" }
          resources:
            requests: { memory: "64Mi",  cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
