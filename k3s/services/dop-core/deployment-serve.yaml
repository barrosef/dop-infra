# Modo serve — a superfície gRPC do domínio (ADR-0016).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-core-serve
spec:
  replicas: 1
  selector:
    matchLabels: { app: dop-core, mode: serve }
  template:
    metadata:
      labels: { app: dop-core, mode: serve }
    spec:
      # The ServiceAccount is what gives the SecretStore access to the
      # Kubernetes API.
      serviceAccountName: dop-core
      # SIGTERM starts the GracefulStop; this is the time for the in-flight calls
      # to finish before the SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-core
          # A versioned tag, never :latest and never a reused tag — rebuilding with
          # the same tag does not guarantee the pod pulls the new layer.
          image: dop-registry:5000/dop/dop-core:0.1.0-6
          args: ["serve"]
          ports:
            - { name: grpc,   containerPort: 9090 }
            - { name: health, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: dop-core-env }
            - secretRef:    { name: dop-core }
          resources:
            requests: { memory: "64Mi",  cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          # The probe uses 9091 (HTTP), not 9090: an httpGet against a gRPC port
          # devolve erro de protocolo e o pod nunca fica pronto.
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
