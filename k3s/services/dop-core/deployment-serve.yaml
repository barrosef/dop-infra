# Modo serve — a superfície gRPC do domínio (ADR-0016).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-core-serve
spec:
  replicas: 1
  selector:
    matchLabels: { app: dop-core, mode: serve }
  template:
    metadata:
      labels: { app: dop-core, mode: serve }
    spec:
      # A ServiceAccount é o que dá ao SecretStore acesso à API do Kubernetes.
      serviceAccountName: dop-core
      # SIGTERM inicia o GracefulStop; este é o tempo para as chamadas em voo
      # terminarem antes do SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-core
          # Tag versionada, nunca :latest nem tag reaproveitada — reconstruir com
          # a mesma tag não garante que o pod puxe a camada nova.
          image: dop-registry:5000/dop/dop-core:0.1.0-5
          args: ["serve"]
          ports:
            - { name: grpc,   containerPort: 9090 }
            - { name: health, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: dop-core-env }
            - secretRef:    { name: dop-core }
          resources:
            requests: { memory: "64Mi",  cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          # A probe usa a 9091 (HTTP), não a 9090: httpGet contra porta gRPC
          # devolve erro de protocolo e o pod nunca fica pronto.
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
