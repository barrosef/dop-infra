# Ambiente comum aos QUATRO modos do core (ADR-0016): uma imagem, um conjunto de
# variáveis, o modo no argumento. Divergir a configuração por modo é como um
# worker acaba falando com um banco diferente do serve.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dop-core-env
data:
  NATS_URL: nats://nats.dop-local.svc:4222

  # k8s é o backend exercitado TODO DIA no local — não existe emulador do GCP
  # Secret Manager, e é essa a disciplina de dois adaptadores da ADR-0001.
  SECRET_BACKEND: k8s
  SECRET_NAMESPACE: dop-local
  KUBERNETES_API: https://kubernetes.default.svc
  # ARMADILHA: o certificado do apiserver é assinado pela CA DO CLUSTER, que não
  # está no bundle público da imagem. Sem apontar a CA, o adaptador falha com
  # "x509: certificate signed by unknown authority" — e só na PRIMEIRA operação
  # de segredo, não no boot: o pod fica Running e verde, e a falha aparece na
  # primeira credencial que alguém tenta salvar.
  # /etc/ssl/certs continuam valendo (Firebase e GCS seguem funcionando).

  # Sem esta variável o upload local vai para o bucket REAL (ADR-0020 §4).
  STORAGE_EMULATOR_HOST: http://firebase.dop-local.svc:9199
  # O core verifica o token do usuário; contra o emulador a assinatura é pulada.
  # Sem isto ele tentaria validar contra as chaves públicas do Google e recusaria
  # todo token emitido localmente.
  FIREBASE_AUTH_EMULATOR_HOST: firebase.dop-local.svc:9099
  FIREBASE_PROJECT: dop-local

  LOG_LEVEL: info
