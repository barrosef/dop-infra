# The environment common to the core's FOUR modes (ADR-0012): one image, one set
# of variables, the mode in the argument. Diverging the configuration per mode is
# how a worker ends up talking to a different database from serve.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dop-core-env
data:
  NATS_URL: nats://nats.dop-local.svc:4222

  # Traces to the local Jaeger (ADR-0024 §4); everything sampled.
  TRACE_BACKEND: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger.dop-local.svc:4317
  TRACE_SAMPLE_RATIO: "1"

  # k8s is the backend exercised EVERY DAY locally — there is no GCP Secret
  # Manager emulator, and that is ADR-0001's two-adapter discipline.
  SECRET_BACKEND: k8s
  SECRET_NAMESPACE: dop-local
  KUBERNETES_API: https://kubernetes.default.svc
  # A TRAP: the apiserver's certificate is signed by the CLUSTER'S CA, which is
  # not in the image's public bundle. Without pointing at the CA, the adapter
  # fails with "x509: certificate signed by unknown authority" — and only on the
  # FIRST secret operation, not at boot: the pod stays Running and green, and the
  # failure shows up on the first credential somebody tries to save.
  # /etc/ssl/certs continuam valendo (Firebase e GCS seguem funcionando).

  # Without this variable a local upload goes to the REAL bucket (ADR-0015 §4).
  STORAGE_EMULATOR_HOST: http://firebase.dop-local.svc:9199
  # The core verifies the user's token; against the emulator the signature is
  # skipped.
  # Sem isto ele tentaria validar contra as chaves públicas do Google e recusaria
  # todo token emitido localmente.
  FIREBASE_AUTH_EMULATOR_HOST: firebase.dop-local.svc:9099
  FIREBASE_PROJECT: dop-local

  LOG_LEVEL: info
  # The projects' root repositories (ADR-0021). PROJECT_REPO_BASE_URL is the
  # address a SANDBOX reaches this server at — it goes into every clone URL, so
  # it has to be resolvable from the sandbox's namespace, not from here.
  PROJECT_REPO_BACKEND: "local"
  PROJECT_REPO_ROOT: "/var/lib/dop/git"
  PROJECT_REPO_BASE_URL: "http://dop-core.dop-local.svc:9091"
  # The core verifies its own callers (ADR-0022). `strict` here and
  # `permissive` in the code's default: the cluster we run gets the guarantee,
  # and whoever clones the repository still gets a core that comes up.
  CALL_AUTH_MODE: "strict"
  # The image a VERIFICATION runs in (ADR-0023). It is OURS and it is fat: the
  # toolchains live here so a build from source is fast, and no image of the
  # customer's project is ever built or pushed.
  RUNNER_IMAGE: "dop-registry:5000/dop/runner:0.1.0"
  # The account's cache is what makes the second run fast. Without it, building
  # from source every time is slower than the registry sequence the decision
  # removed.
  RUNNER_CACHE_SIZE: "10Gi"
  # The collector rides in the core's OWN image — it is a mode of this binary.
  COLLECTOR_IMAGE: "dop-registry:5000/dop/dop-core:0.1.0-13"
  CORE_TARGET: "dop-core.dop-local.svc:9090"
