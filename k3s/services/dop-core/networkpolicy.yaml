# The trust boundary between the BFF and the core, ENFORCED — not agreed.
#
# The core trusts what comes in the metadata (`x-actor-id`, `x-account-id`): the
# one that authenticates is the BFF, and the core assumes only it calls
# (ADR-0016). That is a reasonable decision, but it only holds if "only it
# calls" is TRUE.
#
# Without this policy it was not. Verified with a loose pod in the namespace: it
# reached `dop-core:9090` and, consequently, could declare itself any actor of
# any account. And the platform's design makes that worse than it looks — a
# demand's sandboxes run AGENT CODE, in the same cluster.
#
# Ingress denied by default; only the pods the boundary foresees get through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dop-core-bff-only
  namespace: dop-local
spec:
  podSelector:
    matchLabels: { app: dop-core }
  policyTypes: [Ingress]
  ingress:
    # The BFF, which is the one that authenticates the user.
    - from:
        - podSelector:
            matchLabels: { app: dop-api }
      ports:
        - { protocol: TCP, port: 9090 }
    # The core itself: the worker and the scheduler are the same binary in
    # another mode.
    - from:
        - podSelector:
            matchLabels: { app: dop-core }
      ports:
        - { protocol: TCP, port: 9090 }
    # The COLLECTOR, from the sandboxes' namespaces (P-23 phase 1). It is a
    # container of ours beside the agent, pushing the demand's consumption.
    #
    # Opening 9090 to a namespace where agent code runs would have been
    # unthinkable yesterday. It is acceptable TODAY because of ADR-0029:
    # reaching the port no longer means being believed — without a signature
    # the call arrives with no actor, and the collector's key opens exactly one
    # service. The policy narrows who may knock; the signature decides who is
    # heard.
    - from:
        - namespaceSelector:
            matchLabels: { app.kubernetes.io/managed-by: dop-core }
      ports:
        - { protocol: TCP, port: 9090 }
    # Health and metrics stay open to the kubelet, which probes from outside any
    # pod — restricting this would bring the probes down.
    - ports:
        - { protocol: TCP, port: 9091 }
---
# Postgres is even more sensitive: whoever reaches it does not even need to
# forge an actor, they read everything directly. Only the core talks to it — the
# BFF has NO database (ADR-0016), and this policy is that rule becoming a block
# rather than discipline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-core-only
  namespace: dop-local
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dop-core }
      ports:
        - { protocol: TCP, port: 5432 }
