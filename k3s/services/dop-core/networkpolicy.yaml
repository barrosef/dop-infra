# A fronteira de confiança entre BFF e núcleo, EXECUTADA — não combinada.
#
# O núcleo confia no que vem na metadata (`x-actor-id`, `x-account-id`): quem
# autentica é o BFF, e o núcleo assume que só ele chama (ADR-0016). Isso é uma
# decisão razoável, mas ela só vale se "só ele chama" for VERDADE.
#
# Sem esta política não era. Verificado com um pod avulso no namespace: ele
# alcançava `dop-core:9090` e, por consequência, podia declarar-se qualquer ator
# de qualquer conta. E o desenho da plataforma torna isso pior do que parece —
# sandboxes de demanda rodam CÓDIGO DE AGENTE, no mesmo cluster.
#
# Ingresso negado por padrão; passam só os pods que a fronteira prevê.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dop-core-somente-bff
  namespace: dop-local
spec:
  podSelector:
    matchLabels: { app: dop-core }
  policyTypes: [Ingress]
  ingress:
    # O BFF, que é quem autentica o usuário.
    - from:
        - podSelector:
            matchLabels: { app: dop-api }
      ports:
        - { protocol: TCP, port: 9090 }
    # O próprio núcleo: worker e scheduler são o mesmo binário em outro modo.
    - from:
        - podSelector:
            matchLabels: { app: dop-core }
      ports:
        - { protocol: TCP, port: 9090 }
    # Health e métricas continuam abertos ao kubelet, que sonda de fora de
    # qualquer pod — restringir isto derrubaria as probes.
    - ports:
        - { protocol: TCP, port: 9091 }
---
# O Postgres é ainda mais sensível: quem chega nele não precisa nem forjar ator,
# lê tudo direto. Só o núcleo fala com ele — o BFF NÃO tem banco (ADR-0016), e
# esta política é essa regra virando bloqueio em vez de disciplina.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-somente-core
  namespace: dop-local
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dop-core }
      ports:
        - { protocol: TCP, port: 5432 }
