# O adaptador de SecretStore do core fala com a API do Kubernetes (ADR-0001):
# reads through the API, NEVER from a mounted volume — a volume is eventually
# consistent
# (o kubelet sincroniza em torno de um minuto) e quebraria leitura-após-escrita.
#
# Talking to the API requires a credential. It is the ServiceAccount below that
# provides it: the token is projected into
# /var/run/secrets/kubernetes.io/serviceaccount/token and the
# config.Load o lê no boot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dop-core
---
# A Role, not a ClusterRole: least privilege. The core only needs Secrets from
# THIS namespace — a ClusterRole would give it everybody else's namespace, and
# the blast radius of a bug in the adapter would become the whole cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dop-core-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dop-core-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dop-core-secrets
subjects:
  - kind: ServiceAccount
    name: dop-core
