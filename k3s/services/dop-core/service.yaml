# It points ONLY at the serve mode's pods: it is the only one that answers gRPC.
# A selector by `app: dop-core` alone would send requests to the worker and the
# sched, which do not
# escutam na 9090 — e o sintoma seria intermitente, o pior tipo.
apiVersion: v1
kind: Service
metadata:
  name: dop-core
spec:
  selector:
    app: dop-core
    mode: serve
  ports:
    - { name: grpc,   port: 9090, targetPort: 9090 }
    - { name: health, port: 9091, targetPort: 9091 }
