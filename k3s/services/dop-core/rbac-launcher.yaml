# RBAC of the sandbox LAUNCHER — separate from rbac.yaml on purpose.
#
# The SecretStore adapter lives with a namespaced Role, and that is how it
# should stay. The launcher needs more, because it creates a namespace PER
# DEMAND: `namespaces` and `runtimeclasses` exist inside no namespace, so here
# there is no way to avoid a ClusterRole.
#
# This file does NOT enter the local overlay by default: while `RegisterLauncher`
# is a skeleton, granting these permissions would widen the blast radius with
# nothing in return. Enable it along with the launcher.
#
# `runtimeclasses` deserves an explanation: without `list`, the adapter cannot
# prove WHICH isolation the cluster offers, and `SupportedTiers` returns
# PermissionDenied on purpose. Answering "this cluster has no Kata" when in
# truth we cannot look would be the silent degradation ADR-0001 forbids,
# disguised as RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dop-core-launcher
rules:
  # One namespace per demand; Destroy erases the whole namespace so as not to
  # leave
  # órfão. Sem `delete`, sandbox destruído viraria lixo acumulando no cluster.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]
  # The sandbox's execution and the log tail.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The workspace that survives suspension — it is the only thing the port's
  # guarantee 5
  # porta promete preservar.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get"]
  # Only `list`: discovering what the cluster offers, never creating a
  # RuntimeClass.
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dop-core-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dop-core-launcher
subjects:
  - kind: ServiceAccount
    name: dop-core
    namespace: dop-local
