# Credencial de DESENVOLVIMENTO LOCAL apenas — nunca usada fora do k3d.
# Espelha k3s/services/postgres/secret.yaml. Em QA/stage/prod a URL do banco vem
# do SecretStore (ADR-0001), nunca de manifesto.
apiVersion: v1
kind: Secret
metadata:
  name: dop-core
type: Opaque
stringData:
  DATABASE_URL: postgres://dop:dop-local-dev@postgres.dop-local.svc:5432/dop?sslmode=disable
  # The projects' root repositories (ADR-0028).
  #  - PROJECT_REPO_KEY signs the per-demand tokens the sandboxes clone with. It
  #    has to SURVIVE a restart: regenerating it invalidates every token in
  #    flight, and a sandbox that was working stops being able to push.
  #  - PROJECT_REPO_ADMIN_KEY guards the platform-side API, which the worker and
  #    the sched use to reach the repositories. No sandbox holds it.
  PROJECT_REPO_KEY: "local-dev-project-repo-key-change-me"
  PROJECT_REPO_ADMIN_KEY: "local-dev-project-repo-admin-key"
  # The key the edge signs its assertions with (ADR-0029). The SAME value has to
  # reach dop-api as CALL_AUTH_KEY — a mismatch makes every call arrive with no
  # actor, which in strict mode is an outage.
  CALL_AUTH_KEY_BFF: "local-dev-call-auth-key-change-me"
