# Credencial de DESENVOLVIMENTO LOCAL apenas — nunca usada fora do k3d.
# Espelha k3s/services/postgres/secret.yaml. Em QA/stage/prod a URL do banco vem
# do SecretStore (ADR-0001), nunca de manifesto.
apiVersion: v1
kind: Secret
metadata:
  name: dop-core
type: Opaque
stringData:
  DATABASE_URL: postgres://dop:dop-local-dev@postgres.dop-local.svc:5432/dop?sslmode=disable
