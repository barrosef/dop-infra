# The sched mode — periodic tasks: PR polling, sandbox suspension, partition
# maintenance.
#
# Réplica ÚNICA por desenho: duas instâncias disparariam a mesma tarefa duas
# twice. When HA is needed, the way is leader election, not replicas: 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-core-sched
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: during a rollout the default would bring the
    # new pod up before dropping the old one, and for a few seconds there would
    # be TWO
    # schedulers ativos.
    type: Recreate
  selector:
    matchLabels: { app: dop-core, mode: sched }
  template:
    metadata:
      labels: { app: dop-core, mode: sched }
    spec:
      serviceAccountName: dop-core
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-core
          image: dop-registry:5000/dop/dop-core:0.1.0-13
          args: ["sched"]
          ports:
            - { name: health, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: dop-core-env }
            - secretRef:    { name: dop-core }
          env:
            # Only `serve` HOSTS the projects' root repositories — it is the one
            # with the volume. This mode talks to it over the platform-side API;
            # with the default (`local`) it would host a second, empty set on a
            # disk nobody backs up, and the manifests would be regenerated into
            # the void.
            - { name: PROJECT_REPO_BACKEND,    value: "remote" }
            - { name: PROJECT_REPO_SERVER_URL, value: "http://dop-core.dop-local.svc:9091" }
          resources:
            requests: { memory: "48Mi",  cpu: "25m" }
            limits:   { memory: "192Mi", cpu: "250m" }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
