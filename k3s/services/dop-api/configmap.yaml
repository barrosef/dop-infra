# The BFF has no database (ADR-0016): no Postgres credential here, not even
# "just for a quick query". All state comes from the core over gRPC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dop-api-env
data:
  # The core's Service; it points only at the serve mode's pods.
  CORE_GRPC: dop-core.dop-local.svc:9090

  FIREBASE_AUTH_EMULATOR_HOST: firebase.dop-local.svc:9099
  # O SDK do Cloud Storage lê STORAGE_EMULATOR_HOST; o CLI do Firebase expõe
  # this one. The bridge between the two is made at the BFF's boot (ADR-0020 §4)
  # — without it, a local upload would go to the REAL bucket.
  FIREBASE_STORAGE_EMULATOR_HOST: firebase.dop-local.svc:9199
  FIREBASE_PROJECT: dop-local

  # The cockpit's origins. Two because there are two legitimate paths in the
  # local environment
  # local, e ambos precisam funcionar:
  #   :5173  — `pnpm dev`, the fast loop of whoever is working on the screen
  #   app.localtest.me — the cockpit PUBLISHED on the Hosting emulator, which is
  #                      the path that looks like production
  # A closed list and not `*`: with allow_credentials, `*` is refused by the
  # browser, and loosening it here would hide in development an error that only
  # shows up later.
  CORS_ORIGINS: '["http://localhost:5173","http://app.localtest.me:8080"]'

  LOG_LEVEL: info
