# O BFF por host próprio.
#
# Necessary ever since the cockpit came to be served by the Hosting emulator:
# the page comes from `app.localtest.me` and calls the API through an ABSOLUTE
# URL (a product decision — no Hosting rewrite), so the API needs a stable
# address the BROWSER can reach. `localhost:8000` through a port-forward would
# do, but it ties the cockpit to a tunnel that drops.
#
# A different origin means real CORS on the path — which is precisely what we
# want to exercise here, because in production it will be the same.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dop-api
  namespace: dop-local
spec:
  ingressClassName: traefik
  rules:
    - host: api.localtest.me
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: dop-api, port: { number: 8000 } } } }
