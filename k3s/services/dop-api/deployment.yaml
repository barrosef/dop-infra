# dop-api — the BFF: REST+SSE for the cockpit, gRPC for the CLI and the agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: dop-api }
  template:
    metadata:
      labels: { app: dop-api }
    spec:
      # No ServiceAccount of its own: the BFF does not talk to the Kubernetes
      # API. The one that keeps secrets is the core (ADR-0001).
      automountServiceAccountToken: false
      # Time for the open SSE connections to close before the SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-api
          # A versioned tag, never :latest — rebuilding with the same tag does
          # not guarantee the pod pulls the new layer.
          image: dop-registry:5000/dop/dop-api:0.1.0-12
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: dop-api-env }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "1000m" }
          # /healthz is @public — the probe carries no token and would get a 401
          # on
          # qualquer outra rota.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
