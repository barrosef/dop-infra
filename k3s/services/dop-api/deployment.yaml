# dop-api — BFF: REST+SSE para o cockpit, gRPC para CLI e agentes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dop-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: dop-api }
  template:
    metadata:
      labels: { app: dop-api }
    spec:
      # Sem ServiceAccount própria: o BFF não fala com a API do Kubernetes.
      # Quem guarda segredo é o core (ADR-0001).
      automountServiceAccountToken: false
      # Tempo para as conexões SSE abertas fecharem antes do SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 0
      containers:
        - name: dop-api
          # Tag versionada, nunca :latest — reconstruir com a mesma tag não
          # garante que o pod puxe a camada nova.
          image: dop-registry:5000/dop/dop-api:0.1.0-3
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: dop-api-env }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "1000m" }
          # /healthz é @public — a probe não carrega token e receberia 401 em
          # qualquer outra rota.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
