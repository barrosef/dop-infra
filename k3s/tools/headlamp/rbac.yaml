# WARNING: cluster-admin. See the "Permissions" section of the README next door
# — this holds
# num k3d descartável na máquina do desenvolvedor, e em nenhum outro lugar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: dop-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: dop-local
