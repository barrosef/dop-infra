apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dop-local
resources:
  - ../../base
  - ../../services/postgres
  - ../../services/nats
  - ../../emulators/firebase
  - ../../emulators/secretmanager
  - ../../services/dop-core
  - ../../services/dop-api
  # Ferramenta, não componente do produto: vive fora de `base` de propósito —
  # o ServiceAccount dela é cluster-admin, e isso só vale neste overlay.
  - ../../tools/headlamp
labels:
  - pairs:
      app.kubernetes.io/part-of: dop
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
