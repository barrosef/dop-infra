apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dop-local
resources:
  - ../../base
  - ../../services/postgres
  - ../../services/nats
  - ../../emulators/firebase
  - ../../emulators/secretmanager
  - ../../services/dop-core
  - ../../services/dop-api
  # A tool, not a component of the product: it lives outside `base` on purpose —
  # its ServiceAccount is cluster-admin, and that only holds in this overlay.
  - ../../tools/headlamp
labels:
  - pairs:
      app.kubernetes.io/part-of: dop
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
