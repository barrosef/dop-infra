apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - ingress.yaml
# ADR-0020 §3: the emulator's config is the SAME as the deployment's — files
# versioned in the repository, mounted read-only. An emulator with a config of
# its own lies about production.
configMapGenerator:
  - name: firebase-config
    files:
      - firebase.json
      - storage.rules
      - firebaserc
generatorOptions:
  disableNameSuffixHash: true
