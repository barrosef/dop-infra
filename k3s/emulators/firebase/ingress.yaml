# The emulator reachable through k3d's load balancer (localhost:8080), with no
# port-forward.
#
# kubectl's port-forward does not survive a concurrent burst: the object store's
# contract suites drop the connection and the test fails for the wrong reason,
# hiding (or inventing) an adapter defect. The path through the Ingress is the
# same one the application uses, and it is stable.
#
# It routes by HOST because an Ingress only listens on 80/443: the path does not
# tell auth from storage, but the host does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firebase-emulators
  namespace: dop-local
spec:
  ingressClassName: traefik
  rules:
    # localtest.me resolves to 127.0.0.1 — when there is no DNS, use
    # curl --resolve or the Host header.
    - host: auth.localtest.me
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: firebase, port: { number: 9099 } } } }
    # The cockpit served by the HOSTING emulator — the same path it will have on
    # the real Firebase Hosting, with the SPA rewrite, the cache headers and
    # `/__/firebase/init.js`. Publishing here is `make deploy-app`.
    - host: app.localtest.me
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: firebase, port: { number: 5000 } } } }
    - host: storage.localtest.me
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: firebase, port: { number: 9199 } } } }
