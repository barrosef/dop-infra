apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firebase
spec:
  serviceName: firebase
  replicas: 1
  selector:
    matchLabels: { app: firebase }
  template:
    metadata:
      labels: { app: firebase }
    spec:
      # ADR-0020 §2: tempo para o --export-on-exit concluir.
      # Sem isso o SIGKILL chega antes do export e os dados se perdem AO PARAR.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 1001
        fsGroup: 0
      containers:
        - name: firebase
          image: dop-registry:5000/dop/firebase-emulators:14.24.0-2
          workingDir: /app
          # ADR-0020 §2: --import é CONDICIONAL — passar a flag sem o diretório
          # existir faz o emulador falhar no primeiro start.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              IMPORT_FLAG=""
              if [ -d /emulator-data/saved ] && [ -n "$(ls -A /emulator-data/saved 2>/dev/null)" ]; then
                echo "[emuladores] importando dados de /emulator-data/saved"
                IMPORT_FLAG="--import /emulator-data/saved"
              else
                echo "[emuladores] sem dados salvos — iniciando do zero"
              fi
              # O Hosting recusa subir se `site` não existir. Criar vazio faz o
              # ambiente subir ANTES de qualquer deploy do cockpit — e um 404
              # é diagnóstico honesto ("nada publicado"), diferente de um pod
              # que não sobe.
              mkdir -p /emulator-data/site
              [ -f /emulator-data/site/index.html ] || \
                echo '<!doctype html><meta charset=utf-8><title>DOP</title><p>Nada publicado ainda — rode <code>make deploy-app</code> no dop-infra.' \
                  > /emulator-data/site/index.html
              exec firebase emulators:start \
                --project dop-local \
                --only auth,storage,hosting \
                --export-on-exit /emulator-data/saved \
                $IMPORT_FLAG
          ports:
            - { name: ui,      containerPort: 4000 }
            - { name: hub,     containerPort: 4400 }
            - { name: auth,    containerPort: 9099 }
            - { name: storage, containerPort: 9199 }
            - { name: hosting, containerPort: 5000 }
          volumeMounts:
            - { name: data,   mountPath: /emulator-data }
            # O site publicado mora no PVC, não num emptyDir: `firebase deploy`
            # de verdade sobrevive a restart, e aqui também precisa sobreviver —
            # senão todo reinício do pod desfaz o deploy sem avisar.
            - { name: data,   mountPath: /app/site, subPath: site }
            - { name: config, mountPath: /app/firebase.json,  subPath: firebase.json,  readOnly: true }
            - { name: config, mountPath: /app/storage.rules,  subPath: storage.rules,  readOnly: true }
            - { name: config, mountPath: /app/.firebaserc,    subPath: firebaserc,     readOnly: true }
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1Gi",   cpu: "1500m" }
          readinessProbe:
            # o hub existe sempre; a UI depende de haver emulador com UI
            httpGet: { path: /emulators, port: 4400 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
            # 1s (o padrão) é apertado demais: o hub responde na mesma thread
            # que atende upload, e sob carga a probe expirava com o emulador
            # perfeitamente vivo — visto 7 vezes em 2h de ambiente ocioso.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /emulators, port: 4400 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            # Reiniciar o emulador por lentidão passageira apaga o estado em
            # memória de quem estiver usando. Só reinicia se ele estiver mudo
            # de verdade: 3 falhas × 20s = um minuto sem responder.
            failureThreshold: 3
      volumes:
        - name: config
          configMap: { name: firebase-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
