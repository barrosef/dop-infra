apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firebase
spec:
  serviceName: firebase
  replicas: 1
  selector:
    matchLabels: { app: firebase }
  template:
    metadata:
      labels: { app: firebase }
    spec:
      # ADR-0015 §2: time for the --export-on-exit to finish.
      # Without it the SIGKILL arrives before the export and the data is lost ON
      # SHUTDOWN.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 1001
        fsGroup: 0
      containers:
        - name: firebase
          image: dop-registry:5000/dop/firebase-emulators:14.24.0-2
          workingDir: /app
          # ADR-0015 §2: --import is CONDITIONAL — passing the flag without the
          # directory existing makes the emulator fail on the first start.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              IMPORT_FLAG=""
              if [ -d /emulator-data/saved ] && [ -n "$(ls -A /emulator-data/saved 2>/dev/null)" ]; then
                echo "[emulators] importing data from /emulator-data/saved"
                IMPORT_FLAG="--import /emulator-data/saved"
              else
                echo "[emulators] no saved data — starting from scratch"
              fi
              # Hosting refuses to start if `site` does not exist. Creating it
              # empty makes the environment come up BEFORE any cockpit deploy —
              # and a 404 is an honest diagnosis ("nothing published"), unlike a
              # pod that does not come up.
              mkdir -p /emulator-data/site
              [ -f /emulator-data/site/index.html ] || \
                echo '<!doctype html><meta charset=utf-8><title>DOP</title><p>Nothing published yet — run <code>make deploy-app</code> in dop-infra.' \
                  > /emulator-data/site/index.html
              exec firebase emulators:start \
                --project dop-local \
                --only auth,storage,hosting \
                --export-on-exit /emulator-data/saved \
                $IMPORT_FLAG
          ports:
            - { name: ui,      containerPort: 4000 }
            - { name: hub,     containerPort: 4400 }
            - { name: auth,    containerPort: 9099 }
            - { name: storage, containerPort: 9199 }
            - { name: hosting, containerPort: 5000 }
          volumeMounts:
            - { name: data,   mountPath: /emulator-data }
            # The published site lives on the PVC, not in an emptyDir: a real
            # `firebase deploy` survives a restart, and here it has to survive
            # too — or every pod restart undoes the deploy without warning.
            - { name: data,   mountPath: /app/site, subPath: site }
            - { name: config, mountPath: /app/firebase.json,  subPath: firebase.json,  readOnly: true }
            - { name: config, mountPath: /app/storage.rules,  subPath: storage.rules,  readOnly: true }
            - { name: config, mountPath: /app/.firebaserc,    subPath: firebaserc,     readOnly: true }
          resources:
            requests: { memory: "384Mi", cpu: "100m" }
            limits:   { memory: "1Gi",   cpu: "1500m" }
          readinessProbe:
            # the hub always exists; the UI depends on there being an emulator
            # with a UI
            httpGet: { path: /emulators, port: 4400 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
            # 1s (the default) is far too tight: the hub answers on the same
            # thread that serves uploads, and under load the probe timed out with
            # the emulator perfectly alive — seen 7 times in 2h of an idle
            # environment.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /emulators, port: 4400 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            # Restarting the emulator over passing slowness erases the in-memory
            # state of whoever is using it. It only restarts if it is genuinely
            # mute: 3 failures × 20s = a minute with no answer.
            failureThreshold: 3
      volumes:
        - name: config
          configMap: { name: firebase-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
