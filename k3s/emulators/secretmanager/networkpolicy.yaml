# Only the CORE talks to the secrets emulator.
#
# The same logic as dop-core's and postgres' policies: the emulator has no IAM,
# no authentication and no TLS — any pod that can reach it reads and writes ANY
# secret of ANY account. And the platform's design makes that worse than it
# looks: a demand's sandboxes run AGENT CODE, in the same cluster.
#
# Without this policy, the local environment's vault is public within the
# namespace. The policy is what replaces, here, the IAM that in production is
# the second barrier of the isolation between accounts — and that no local test
# exercises.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secretmanager-core-only
  namespace: dop-local
spec:
  podSelector:
    matchLabels: { app: secretmanager }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: dop-core }
      ports:
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 8080 }
    # There is NO exception for the probes. They run through `exec` INSIDE the
    # pod (see deployment.yaml): opening 8080 to the kubelet — which probes from
    # outside any pod, and therefore from an origin that cannot be restricted by
    # a podSelector — would open the REST gateway to the whole namespace, which
    # is exactly what this policy exists to prevent.
