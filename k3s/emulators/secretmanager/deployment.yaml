# Emulador do GCP Secret Manager — SOMENTE ambiente de desenvolvimento.
#
# ORIGEM:   https://github.com/blackwell-systems/gcp-secret-manager-emulator
# LICENÇA:  Apache-2.0 (rótulo org.opencontainers.image.licenses da imagem)
# VERSÃO:   1.9.0
#
# POR QUE UM EMULADOR DE TERCEIRO. O Google NÃO publica emulador do Secret
# Manager — tem de Storage, Pub/Sub, Firestore, Bigtable, Spanner, mas não
# deste. Sem ele o adaptador `gcp` do dop-core só seria exercitável com projeto
# GCP de verdade, e a regra dos dois adaptadores da ADR-0001 viraria letra
# morta para a porta SecretStore. Escrever o NOSSO é a pendência P-17 do
# ROADMAP; até lá, o da comunidade.
#
# POR QUE FIXADO POR DIGEST E NÃO POR TAG. É dependência de terceiro, pequena,
# de mantenedor único, que entra no cluster para MANIPULAR SEGREDOS. Tag é
# ponteiro mutável: quem publica `1.9.0` pode republicar `1.9.0` amanhã com
# outro conteúdo, e o kubelet puxaria a imagem nova sem ninguém aprovar nada.
# Digest é o conteúdo. Para atualizar, resolva o digest novo à mão e troque
# aqui, no mesmo commit em que se revisa o que mudou:
#
#   TOK=$(curl -s "https://ghcr.io/token?scope=repository:blackwell-systems/gcp-secret-manager-emulator-dual:pull&service=ghcr.io" \
#         | sed -E 's/.*"token":"([^"]+)".*/\1/')
#   curl -sI -H "Authorization: Bearer $TOK" \
#     -H "Accept: application/vnd.oci.image.index.v1+json" \
#     https://ghcr.io/v2/blackwell-systems/gcp-secret-manager-emulator-dual/manifests/<TAG> \
#     | grep -i docker-content-digest
#
# O digest abaixo é o do ÍNDICE multi-arquitetura (amd64 e arm64), e não o de
# uma arquitetura só — fixar o de uma quebraria a máquina de quem usa a outra.
#
# POR QUE Deployment E NÃO StatefulSet, ao contrário do emulador do Firebase.
# Este emulador é uma tabela em MEMÓRIA: o /data que a imagem declara fica
# vazio, não há flag de import/export (o binário só aceita -grpc-port,
# -http-port e -log-level) e um restart apaga tudo — verificado. Um
# volumeClaimTemplate aqui prometeria durabilidade que não existe. A
# consequência prática está em docs/ambiente-local.md: ao reiniciar o pod, TODA
# credencial gravada no ambiente local some, e precisa ser regravada.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretmanager
  labels: { app: secretmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: secretmanager }
  strategy:
    # Recreate, não RollingUpdate: com o estado em memória, dois pods vivos ao
    # mesmo tempo significam dois cofres DIFERENTES atendendo o mesmo Service —
    # gravação num, leitura no outro, e um "segredo sumiu" impossível de
    # entender.
    type: Recreate
  template:
    metadata:
      labels: { app: secretmanager }
    spec:
      securityContext:
        # A imagem já roda como gcpmock (uid 1000). Declarar aqui é o que faz o
        # cluster RECUSAR se um dia ela mudar para root.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: emulator
          image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual@sha256:2c9d3bb0453fdff102b29af00b4abd9b2c6fa466031a9d8e6d93a270ba22a6e2
          args: ["-grpc-port", "9090", "-http-port", "8080", "-log-level", "info"]
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "32Mi", cpu: "10m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          # Sondas por EXEC, de dentro do pod, e não httpGet.
          #
          # httpGet é sondado pelo KUBELET, que fala de fora de qualquer pod: a
          # NetworkPolicy ao lado precisaria abrir a porta 8080 para toda origem
          # para as probes passarem — e 8080 é o gateway REST, com leitura e
          # escrita de QUALQUER segredo. A exceção que faz o pod ficar pronto
          # seria a mesma que abre o cofre para o namespace inteiro. Sondando
          # por dentro, a política fica estrita de verdade.
          #
          # A sonda checa as DUAS pontas: a porta gRPC (que é a que o dop-core
          # usa) aceita conexão, E a API responde. Só a segunda deixaria passar
          # um listener gRPC morto; só a primeira, um processo travado.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z 127.0.0.1 9090 && wget -q -O /dev/null http://127.0.0.1:8080/v1/projects/sonda/secrets
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z 127.0.0.1 9090 && wget -q -O /dev/null http://127.0.0.1:8080/v1/projects/sonda/secrets
            initialDelaySeconds: 15
            periodSeconds: 20
            # Reiniciar este pod APAGA todos os segredos do ambiente local.
            # Três falhas seguidas (um minuto mudo) antes de pagar esse preço.
            failureThreshold: 3
