# The GCP Secret Manager emulator — DEVELOPMENT ENVIRONMENT ONLY.
#
# SOURCE:   https://github.com/blackwell-systems/gcp-secret-manager-emulator
# LICENCE:  Apache-2.0 (the image's org.opencontainers.image.licenses label)
# VERSION:  1.9.0
#
# WHY A THIRD-PARTY EMULATOR. Google does NOT publish a Secret Manager emulator
# — it has one for Storage, Pub/Sub, Firestore, Bigtable and Spanner, but not
# for this one. Without it dop-core's `gcp` adapter would only be exercisable
# against a real GCP project, and ADR-0001's two-adapter rule would become a
# dead letter for the SecretStore port. Writing OUR OWN is the ROADMAP's pending
# item P-17; until then, the community's.
#
# WHY PINNED BY DIGEST AND NOT BY TAG. It is a third-party dependency, small,
# with a single maintainer, that enters the cluster to HANDLE SECRETS. A tag is
# a mutable pointer: whoever publishes `1.9.0` may republish `1.9.0` tomorrow
# with different content, and the kubelet would pull the new image with nobody
# approving anything. A digest is the content. To update, resolve the new digest
# by hand and swap it here, in the same commit in which what changed is
# reviewed:
#
#   TOK=$(curl -s "https://ghcr.io/token?scope=repository:blackwell-systems/gcp-secret-manager-emulator-dual:pull&service=ghcr.io" \
#         | sed -E 's/.*"token":"([^"]+)".*/\1/')
#   curl -sI -H "Authorization: Bearer $TOK" \
#     -H "Accept: application/vnd.oci.image.index.v1+json" \
#     https://ghcr.io/v2/blackwell-systems/gcp-secret-manager-emulator-dual/manifests/<TAG> \
#     | grep -i docker-content-digest
#
# The digest below is the MULTI-ARCHITECTURE INDEX's (amd64 and arm64), and not
# a single architecture's — pinning one would break the machine of whoever uses
# the other.
#
# WHY A Deployment AND NOT A StatefulSet, unlike the Firebase emulator. This
# emulator is an IN-MEMORY table: the /data the image declares stays empty,
# there is no import/export flag (the binary only accepts -grpc-port, -http-port
# and -log-level) and a restart erases everything — verified. A
# volumeClaimTemplate here would promise a durability that does not exist. The
# practical consequence is in docs/local-environment.md: on restarting the pod,
# EVERY credential written in the local environment disappears and has to be
# written again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretmanager
  labels: { app: secretmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: secretmanager }
  strategy:
    # Recreate, not RollingUpdate: with the state in memory, two pods alive at
    # at the same time mean two DIFFERENT vaults serving the same Service —
    # a write to one, a read from the other, and a "the secret disappeared"
    # impossible to understand.
    type: Recreate
  template:
    metadata:
      labels: { app: secretmanager }
    spec:
      securityContext:
        # The image already runs as gcpmock (uid 1000). Declaring it here is
        # what makes the cluster REFUSE if it ever changes to root.
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: emulator
          image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual@sha256:2c9d3bb0453fdff102b29af00b4abd9b2c6fa466031a9d8e6d93a270ba22a6e2
          args: ["-grpc-port", "9090", "-http-port", "8080", "-log-level", "info"]
          ports:
            - { name: grpc, containerPort: 9090 }
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "32Mi", cpu: "10m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          # Probes by EXEC, from inside the pod, and not httpGet.
          #
          # httpGet is probed by the KUBELET, which speaks from outside any pod:
          # the NetworkPolicy next door would have to open port 8080 to every
          # origin for the probes to pass — and 8080 is the REST gateway, with
          # read and write access to ANY secret. The exception that makes the pod
          # ready would be the same one that opens the vault to the whole
          # namespace. By probing from the inside, the policy stays genuinely strict.
          #
          # The probe checks BOTH ends: the gRPC port (the one dop-core uses)
          # accepts a connection, AND the API answers. Only the second would let
          # through a dead gRPC listener; only the first, a stuck process.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z 127.0.0.1 9090 && wget -q -O /dev/null http://127.0.0.1:8080/v1/projects/probe/secrets
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - nc -z 127.0.0.1 9090 && wget -q -O /dev/null http://127.0.0.1:8080/v1/projects/probe/secrets
            initialDelaySeconds: 15
            periodSeconds: 20
            # Restarting this pod ERASES every secret in the local environment.
            # Three failures in a row (a mute minute) before paying that price.
            failureThreshold: 3
