apiVersion: v1
kind: Service
metadata:
  name: secretmanager
spec:
  selector: { app: secretmanager }
  ports:
    # grpc is the one dop-core uses: the official Secret Manager library speaks
    # gRPC. The REST gateway stays exposed for debugging with curl.
    - { name: grpc, port: 9090, targetPort: 9090 }
    - { name: http, port: 8080, targetPort: 8080 }
